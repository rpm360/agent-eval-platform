models:

  - id: gemini-flash-lite-3.1
    litellm: gemini/gemini-3.1-flash-lite
    provider: google
    env_key: GEMINI_API_KEY
    env_aliases:
      - GOOGLE_API_KEY
    pricing:
      input_per_mtok: 0.25
      output_per_mtok: 1.50

  - id: gemini-pro
    litellm: gemini/gemini-3.1-pro-preview
    provider: google
    env_key: GEMINI_API_KEY
    env_aliases:
      - GOOGLE_API_KEY
    fallback: gemini/gemini-3.8-flash
    pricing:
      input_per_mtok: 2.00
      output_per_mtok: 12.00

  - id: claude-haiku
    litellm: anthropic/claude-haiku-4-5
    provider: anthropic
    env_key: ANTHROPIC_API_KEY
    pricing:
      input_per_mtok: 1.00
      output_per_mtok: 5.00


  # Cloud Run vLLM open-weight endpoint (1x NVIDIA L4, allow_unauthenticated=True)
  - id: Qwen2.5-7B
    litellm: openai/Qwen/Qwen2.5-7B-Instruct-AWQ
    provider: vllm
    api_base: https://oss-llm-test-874570031229.asia-southeast1.run.app/v1
    requires_api_key: false
    pricing:
      input_per_mtok: 0.05
      output_per_mtok: 0.02

  - id: mock
    litellm: mock/scripted
    provider: mock
    adapter: mock
    env_key: ""
    requires_api_key: false
    pricing:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
