services:
  worker-hermes:
    image: agent-eval-hermes:latest
    build:
      context: .
      dockerfile: Dockerfile.hermes
    command: ["true"]
    restart: "no"

  worker-langgraph:
    image: agent-eval-langgraph:latest
    build:
      context: .
      dockerfile: Dockerfile.langgraph
    command: ["true"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      worker-hermes:
        condition: service_completed_successfully
      worker-langgraph:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - EVAL_ROOT_DIR=/app
      - EVAL_PYTHON_BIN=/usr/local/bin/python3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./results:/app/results
      - ./tasks:/app/tasks
      - ./configs:/app/configs
      - ./calibration:/app/calibration
      - ./models.yaml:/app/models.yaml
      - ./.env:/app/.env
