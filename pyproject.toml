[project]
name = "agent-eval-platform"
version = "0.1.0"
description = "Lean Agent Evaluation Platform for Hermes + LangGraph across Gemini + Claude"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1.0",
    "litellm>=1.60.0",
    "tenacity>=9.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
eval-run = "eval_runner.cli:run_cmd"
eval-retry = "eval_runner.cli:retry_cmd"
eval-compare = "eval_runner.cli:compare_cmd"
eval-inspect = "eval_runner.cli:inspect_cmd"
eval-export = "eval_runner.cli:export_cmd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
